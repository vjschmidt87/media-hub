server:
  port: 8091

spring:
  application:
    name: media-hub-backend
  datasource:
    url: jdbc:postgresql://localhost:5441/mediahub
    username: mediahub
    password: mediahub123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:media-hub-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
    email: ${ADMIN_EMAIL:admin@mediahub.local}

logging:
  level:
    com.mediahub: INFO
    org.springframework.security: WARN
